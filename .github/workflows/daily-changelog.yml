name: Gerar release após CI

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: stickerbot-release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar versão e changelog juntos
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node scripts/increment-version.js
          npm install --package-lock-only --ignore-scripts
          node scripts/generate-release-changelog.js

      - name: Publicar commit único da release
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nenhuma release nova"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore(release): publish ${VERSION}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          RELEASE_SHA=$(git rev-parse HEAD)
          gh workflow run deploy-main.yml --ref "${{ github.event.repository.default_branch }}" -f target_sha="$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
